name: Build Chrome Bisect Script

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 6'

defaults:
  run:
    shell: bash

env:
  distpath: ${{ github.workspace }}/chrome_bisect

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            jid: 1
          - os: ubuntu-22.04-arm
            jid: 2
          - os: macos-15-intel
            jid: 3
          - os: macos-15
            jid: 4
          - os: windows-2025
            jid: 5
          - os: windows-11-arm
            jid: 6

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up latest Python and OpenSSL
        uses: jay0lee/python-openssl-latest@v1

      - name: MacOS import developer certificates for signing
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: signing_temp
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Run Python
        run: |
          "$PYTHON" -V
          "$PYTHON" -c "import ssl; print(f'Using {ssl.OPENSSL_VERSION}')"

      - name: Create venv
        run: |
          "${PYTHON}" -m venv "${GITHUB_WORKSPACE}/venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "PYTHON=${GITHUB_WORKSPACE}/venv/Scripts/python.exe" >> $GITHUB_ENV
          else
            echo "PYTHON=${GITHUB_WORKSPACE}/venv/bin/python3" >> $GITHUB_ENV
          fi

      - name: Upgrade pip, wheel, etc
        run: |
          "${PYTHON}" -m pip install --upgrade pip
          "${PYTHON}" -m pip install --upgrade wheel
          "${PYTHON}" -m pip install --upgrade setuptools

      - name: Install PyInstaller
        run: |
          git clone https://github.com/pyinstaller/pyinstaller.git
          cd pyinstaller
          export latest_release=$(git tag --list | grep -v dev | grep -v rc | sort -Vr | head -n1)
          git checkout "${latest_release}"
          # remove pre-compiled bootloaders so we fail if bootloader compile fails
          rm -rvf PyInstaller/bootloader/*-*/*
          cd bootloader
          "${PYTHON}" ./waf all
          "${PYTHON}" -m pip install ..

      - name: Install requirements
        run: |
          "${PYTHON}" -m pip install -r requirements.txt
        
      - name: Download bisect script
        run: |
          curl --retry 5 --retry-delay 10 --fail -s \
            -o ./bisect_builds.py \
            "https://raw.githubusercontent.com/chromium/chromium/main/tools/bisect-builds.py"
          if [ ! -s ./bisect_builds.py ]; then
            echo "ERROR: bisect_builds.py download failed or is empty"
            exit 1
          fi
          file ./bisect_builds.py
          "${PYTHON}" ./bisect_builds.py --help

      - name: Download Google CA bundle
        run: curl -o ./roots.pem https://pki.goog/roots.pem

      - name: Set datetime version string
        id: dateversion
        run: |
          export dateversion="$(date  +'%Y%m%d.%H%M%S')"
          echo "Date version: ${dateversion}"
          echo "version = \"${dateversion}\"" > version.py
          cat version.py

      - name: Compile bisect script
        run: |
          export codesign_identity="Jay Lee"
          "${PYTHON}" -m PyInstaller --onedir --clean --noconfirm --codesign-identity "$codesign_identity" --distpath $distpath chrome_bisect.py
          cp roots.pem $distpath/chrome_bisect/

      - name: Run bisect executable
        run: |
          $distpath/chrome_bisect/chrome_bisect --help
          $distpath/chrome_bisect/chrome_bisect --version

      - name: "Smoke test: end-to-end bisect with synthetic good/bad boundary"
        if: runner.os == 'Linux' && runner.arch == 'X64'
        timeout-minutes: 30
        run: |
          # Perform a real bisect to verify the full pipeline works:
          # downloading builds, launching Chromium, and narrowing a range.
          #
          # Since we need deterministic good/bad results without user input,
          # we create a synthetic boundary: a helper script checks each
          # build's major version and marks anything below a threshold as
          # "good" and anything at or above it as "bad". The threshold is
          # set to stable-3 (the midpoint of the default stable-6..HEAD
          # range) so the bisect has real work to do on both sides.
          threshold=$(python3 -c "
          import urllib.request, json
          url = 'https://versionhistory.googleapis.com/v1/chrome/platforms/all/channels/stable/versions/all/releases?fields=releases%2Fversion%2CnextPageToken'
          data = json.loads(urllib.request.urlopen(url).read())
          milestones = sorted(set(int(r['version'].split('.')[0]) for r in data['releases']), reverse=True)
          print(milestones[3])
          ")
          echo ""
          echo "=== Smoke test: end-to-end bisect with synthetic good/bad boundary ==="
          echo "Performing a bisect to verify the full pipeline (download, launch, narrow range)."
          echo "Builds with major version < M${threshold} will be marked 'good'."
          echo "Builds with major version >= M${threshold} will be marked 'bad'."
          echo ""

          # Helper script: exit 0 (good) if version < threshold,
          # exit 1 (bad) if version >= threshold.
          cat > /tmp/bisect_test.sh << 'EOF'
          #!/bin/bash
          version=$("$1" --no-sandbox --product-version 2>/dev/null | cut -d. -f1)
          if [ -z "$version" ]; then
            echo "Could not determine Chromium version"
            exit 1
          fi
          if [ "$version" -ge "$2" ]; then
            echo "Version $version >= $2 (bad)"
            exit 1
          fi
          echo "Version $version < $2 (good)"
          exit 0
          EOF
          chmod +x /tmp/bisect_test.sh

          $distpath/chrome_bisect/chrome_bisect \
            --not-interactive \
            --command "/tmp/bisect_test.sh %p ${threshold}" \
            2>&1 | tee /tmp/bisect_output.txt

          # Verify the bisect found the expected milestone boundary.
          # Extract the changelog URL from bisect output and fetch the
          # commits via the Gitiles JSON API (fast, no git clone needed).
          changelog_url=$(grep -oE 'https://chromium.googlesource.com/chromium/src/\+log/[^ ]+' /tmp/bisect_output.txt | head -1)
          if [ -z "$changelog_url" ]; then
            echo "ERROR: No changelog URL found in bisect output"
            exit 1
          fi
          echo ""
          echo "=== Verifying bisect result ==="
          echo "Changelog URL: ${changelog_url}"
          if curl --retry 3 --fail -s "${changelog_url}?format=JSON" | grep -q "major version to ${threshold}"; then
            echo "PASS: Changelog contains the M${threshold} version bump commit"
          else
            echo "FAIL: M${threshold} version bump not found in changelog: ${changelog_url}"
            exit 1
          fi

      - name: Package binaries
        id: package-binaries
        run: |
          # MacOS and it's old bash causes us this pain...
          export runner_os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          export runner_arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          export archivefile="chrome-bisect-${runner_os}-${runner_arch}.zip"
          echo "archive file will be named ${archivefile}."
          cd "$distpath"
          if [ "$RUNNER_OS" == 'Windows' ]; then
            /c/Program\ Files/7-Zip/7z.exe a -tzip "$archivefile" .
          else
            zip -r "$archivefile" .
          fi
          mv -v "$archivefile" "$GITHUB_WORKSPACE"
          echo "archivefile=${archivefile}" >> "$GITHUB_OUTPUT"

      - name: MacOS send binary for Apple notarization
        if: runner.os == 'macOS'
        env:
          APPLE_KEY: ${{ secrets.APPLE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          FILENAME: ${{ steps.package-binaries.outputs.archivefile }}
        run: |
          export KEY_FILE="$(mktemp).p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$APPLE_KEY" > "$KEY_FILE"
          xcrun notarytool submit --key "$KEY_FILE" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID" "$FILENAME"

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-bisect-${{ matrix.jid }}
          path: |
            ${{ steps.package-binaries.outputs.archivefile }}

  publish:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        
      - name: Set datetime version string
        id: dateversion
        run: |
          export dateversion="$(date  +'%Y%m%d.%H%M%S')"
          echo "Date version: ${dateversion}"
          echo "dateversion=${dateversion}" >> $GITHUB_OUTPUT

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            chrome-bisect-*/*.zip

      - name: Draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          tag_name: "${{ steps.dateversion.outputs.dateversion }}"
          name: "Chrome Bisect ${{ steps.dateversion.outputs.dateversion }}"
          files: |
            chrome-bisect-*/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: false
          prerelease: false
          tag_name: "${{ steps.dateversion.outputs.dateversion }}"
          name: "Chrome Bisect ${{ steps.dateversion.outputs.dateversion }}"
