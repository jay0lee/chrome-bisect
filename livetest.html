<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Bisect Verification Test</title>
  <style>
    :root {
      --bg-pass: #166534;
      --bg-fail: #991b1b;
      --card-bg: rgba(0, 0, 0, 0.45);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-muted: rgba(255, 255, 255, 0.75);
      --code-bg: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #ffffff;
      background-color: #1e293b;
      transition: background-color 0.15s ease-out;
    }

    body.pass {
      background-color: var(--bg-pass);
    }

    body.fail {
      background-color: var(--bg-fail);
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2.25rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .panel {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid rgba(255, 255, 255, 0.35);
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .panel-row:first-child {
      padding-top: 0;
    }

    .panel-label {
      color: var(--text-muted);
    }

    .panel-value {
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    p.details {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    code {
      background: rgba(255, 255, 255, 0.14);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #fff;
    }

    #automation-tag {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 1.5rem;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body id="page-body">

      <div class="panel-row">

        <span class="panel-value" id="eval-mode">Synchronous IDL</span>
      </div>
    </div>

    <p class="details" id="guidance"></p>
    <div id="automation-tag"></div>
  </div>
