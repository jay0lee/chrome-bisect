<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Bisect Test</title>
  <style>
    :root {
      --bg-good: #166534;
      --bg-bad: #991b1b;
      --card-bg: rgba(0, 0, 0, 0.45);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-muted: rgba(255, 255, 255, 0.75);
      --code-bg: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #ffffff;
      background-color: #1e293b;
      transition: background-color 0.15s ease-out;
    }

    body.good { background-color: var(--bg-good); }
    body.bad  { background-color: var(--bg-bad); }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2.25rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .panel {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid rgba(255, 255, 255, 0.35);
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-row:last-child  { border-bottom: none; padding-bottom: 0; }
    .panel-row:first-child { padding-top: 0; }

    .panel-label { color: var(--text-muted); }

    .panel-value {
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: right;
      max-width: 65%;
      word-break: break-all;
    }

    .status-icon {
      font-size: 1.1rem;
      margin-right: 0.35rem;
    }

    p.guidance {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    code {
      background: rgba(255, 255, 255, 0.14);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #fff;
    }

    /* Hidden element for CI/CD --dump-dom automation */
    #ci-result { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">Chrome Bisect Test</span>
    <h1 id="headline">Testing…</h1>
    <p class="subtitle" id="summary"></p>

    <div class="panel">
      <div class="panel-row">
        <span class="panel-label">API</span>
        <span class="panel-value" id="api-name">GPUAdapter.prototype.isFallbackAdapter</span>
      </div>
      <div class="panel-row">
        <span class="panel-label">Status</span>
        <span class="panel-value" id="api-status">…</span>
      </div>
      <div class="panel-row">
        <span class="panel-label">Browser</span>
        <span class="panel-value" id="browser-version">…</span>
      </div>
    </div>

    <p class="guidance" id="guidance"></p>
  </div>

  <!-- Hidden element for CI/CD automation (--dump-dom + grep) -->
  <div id="ci-result"></div>

  <script>
    (function () {
      var headline = document.getElementById('headline');
      var summary  = document.getElementById('summary');
      var guidance = document.getElementById('guidance');
      var status   = document.getElementById('api-status');
      var ciResult = document.getElementById('ci-result');
      var browserVersion = document.getElementById('browser-version');

      // String concatenation prevents grep from matching inside the
      // <script> body when using --dump-dom in CI/CD.
      var tokenGood = 'BISECT' + '_' + 'PASS';
      var tokenBad  = 'BISECT' + '_' + 'FAIL';

      // Attempt to get the real full version via User-Agent Client Hints
      // (the reduced UA string freezes minor/build/patch to 0.0.0).
      function updateVersion() {
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          navigator.userAgentData.getHighEntropyValues(['fullVersionList'])
            .then(function (ua) {
              var found = null;
              var list = ua.fullVersionList || [];
              for (var i = 0; i < list.length; i++) {
                var brand = list[i].brand;
                if (brand === 'Chromium' || brand === 'Google Chrome') {
                  found = list[i];
                  break;
                }
              }
              if (found) {
                browserVersion.textContent = 'Chrome ' + found.version;
              }
            })
            .catch(function () { /* keep fallback */ });
        }
      }

      // Fallback: use the UA string (may show 0.0.0 for minor/build/patch).
      var ua = navigator.userAgent || '';
      var chromeMatch = ua.match(/Chrom(?:e|ium)\/([0-9.]+)/);
      browserVersion.textContent = chromeMatch ? 'Chrome ' + chromeMatch[1] : ua.substring(0, 60);
      updateVersion();

      try {
        var apiExists = typeof GPUAdapter !== 'undefined' &&
                        Boolean(GPUAdapter.prototype) &&
                        'isFallbackAdapter' in GPUAdapter.prototype;

        if (apiExists) {
          document.body.className = 'good';
          ciResult.textContent = tokenGood;
          headline.textContent = 'GOOD';
          summary.textContent  = 'The API is available in this build.';
          status.innerHTML     = '<span class="status-icon">✅</span> Present';
          guidance.innerHTML   =
            'Exit this browser and mark the build as ' +
            '<strong>g</strong> (good) in Chrome Bisect.';
        } else {
          document.body.className = 'bad';
          ciResult.textContent = tokenBad;
          headline.textContent = 'BAD';
          summary.textContent  = 'The API is not available in this build.';
          status.innerHTML     = '<span class="status-icon">❌</span> Not available';
          guidance.innerHTML   =
            'Exit this browser and mark the build as ' +
            '<strong>b</strong> (bad) in Chrome Bisect.';
        }
      } catch (err) {
        document.body.className = 'bad';
        ciResult.textContent = tokenBad;
        headline.textContent = 'ERROR';
        summary.textContent  = err.name + ': ' + err.message;
        status.innerHTML     = '<span class="status-icon">⚠️</span> Error';
        guidance.textContent = 'An unexpected error occurred while checking the API.';
      }
    })();
  </script>
</body>
</html>
